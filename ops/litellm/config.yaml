# LiteLLM — passerelle modèles unifiée (API OpenAI-compatible sur http://localhost:4000)
# Le routeur de classification appelle un "model_name" logique ; LiteLLM dispatche
# vers le bon fournisseur souverain. ADAPTE les `model:` aux modèles réellement
# disponibles dans ta console Scaleway / Mistral (les noms évoluent).
#
# Doc modèles Scaleway Generative APIs :
#   https://www.scaleway.com/en/docs/generative-apis/reference-content/supported-models/

model_list:
  # Noms VÉRIFIÉS contre GET https://api.scaleway.ai/v1/models (2026-07) —
  # un nom inconnu = « Une erreur est survenue côté agent » dans le chat.
  # ── Tier « interne » rapide (généraliste / edge) ─────────────────────────────
  - model_name: sovereign-fast
    litellm_params:
      model: openai/mistral-small-3.2-24b-instruct-2506
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_GENERATIVE_API_KEY

  # ── Tier « interne » fort (raisonnement) ─────────────────────────────────────
  - model_name: sovereign-strong
    litellm_params:
      model: openai/mistral-medium-3.5-128b
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_GENERATIVE_API_KEY

  # ── Redondance UE (Mistral La Plateforme) — RÉACTIVER seulement avec une
  #    vraie MISTRAL_API_KEY : le même nom logique est load-balancé
  #    (simple-shuffle), une clé vide ferait échouer la moitié des appels.
  # - model_name: sovereign-strong
  #   litellm_params:
  #     model: mistral/mistral-small-latest
  #     api_key: os.environ/MISTRAL_API_KEY

  # ── Transcription audio (spike F1) ───────────────────────────────────────────
  # Scaleway expose /v1/audio/transcriptions, compatible OpenAI, avec
  # whisper-large-v3 — donc SUR LE MÊME tier souverain que le reste, sans
  # nouveau fournisseur ni nouveau contrat.
  # Facturation à la SECONDE d'audio (et non au token) : une dictée de devis de
  # trois minutes coûte trois minutes.
  # Doc : https://www.scaleway.com/en/docs/generative-apis/how-to/query-audio-models/
  #
  # `mode: audio_transcription` est ce qui permet à LiteLLM de router ce nom
  # logique vers /audio/transcriptions et non vers /chat/completions.
  - model_name: transcription
    litellm_params:
      model: openai/whisper-large-v3        # <- confirmer le nom exact en console
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_GENERATIVE_API_KEY
    model_info:
      mode: audio_transcription

  # ── Embeddings multilingues (souverains) ─────────────────────────────────────
  - model_name: embeddings
    litellm_params:
      model: openai/bge-multilingual-gemma2        # <- nom à confirmer dans Scaleway
      api_base: https://api.scaleway.ai/v1
      api_key: os.environ/SCW_GENERATIVE_API_KEY

  # ── Tier « confidentiel » : à pointer vers un endpoint Managed Inference dédié
  #    ou un vLLM privé. Laisse commenté tant que non provisionné.
  # - model_name: confidential
  #   litellm_params:
  #     model: openai/mistral-small
  #     api_base: https://<ton-endpoint-managed-inference>/v1
  #     api_key: os.environ/SCW_MANAGED_INFERENCE_KEY

  # ── Tier « frontier » (NON souverain) — OPT-IN par tenant, catégorie
  #    non_sensible UNIQUEMENT (garde dure dans packages/llm). Laisser commenté
  #    tant qu'aucun tenant ne l'a activé.
  # - model_name: frontier
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  fallbacks:
    - sovereign-strong: ["sovereign-fast"]

litellm_settings:
  drop_params: true
  # set_verbose: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
