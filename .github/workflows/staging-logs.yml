# Diagnostic : dump des derniers logs des conteneurs staging via l'API Cockpit
# (Loki). Lecture seule, token query_logs éphémère (créé puis supprimé dans le
# run). Aucun secret applicatif affiché : les conteneurs ne loggent jamais de
# valeur de secret (règle 5), et le token Cockpit est masqué.

name: Staging container logs

on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Conteneurs à inspecter (séparés par des espaces)"
        default: "api litellm"

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID || '955f9c20-9d60-4943-a810-71c737a42a45' }}
    steps:
      - name: Garde-fou secrets
        run: |
          [ -n "$SCW_SECRET_KEY" ] || { echo "::error::SCW_SECRET_KEY manquant"; exit 1; }

      - name: Logs Cockpit des conteneurs
        run: |
          set -euo pipefail
          API="https://api.scaleway.com/cockpit/v1/regions/fr-par"
          # Token éphémère query_logs (secret masqué immédiatement).
          # NB : le champ s'appelle token_scopes (un champ scopes inconnu est
          # ignoré et produit un token SANS droits -> 403 sur Loki).
          TOK_JSON="$(curl -s -X POST -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H 'content-type: application/json' \
            -d "{\"project_id\":\"$SCW_DEFAULT_PROJECT_ID\",\"name\":\"ci-logs-$GITHUB_RUN_ID\",\"token_scopes\":[\"query_logs\"]}" \
            "$API/tokens")"
          TOKEN_ID="$(echo "$TOK_JSON" | jq -r '.id // empty')"
          TOKEN_SECRET="$(echo "$TOK_JSON" | jq -r '.secret_key // empty')"
          if [ -z "$TOKEN_SECRET" ]; then
            echo "::error::Création du token Cockpit impossible :"
            echo "$TOK_JSON" | jq -r '.message // .' || true
            exit 1
          fi
          echo "::add-mask::$TOKEN_SECRET"
          echo "Scopes du token : $(echo "$TOK_JSON" | jq -c '.scopes // .token_scopes // "?"')"
          # La source de données logs porte sa propre URL (schéma récent
          # <ds-id>.logs.cockpit...) ; repli sur l'URL historique sinon.
          DS_JSON="$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "$API/data-sources?project_id=$SCW_DEFAULT_PROJECT_ID&types=logs")"
          echo "Sources de données logs : $(echo "$DS_JSON" | jq -r '.total_count // "?"')"
          echo "$DS_JSON" | jq -r '.data_sources[]? | "- \(.name) [\(.type)] \(.url)"' || true
          DS_URL="$(echo "$DS_JSON" | jq -r '.data_sources[0].url // empty')"
          [ -n "$DS_URL" ] || DS_URL="https://logs.cockpit.fr-par.scw.cloud"
          echo "URL interrogée : $DS_URL"
          # Piste parallèle : l'endpoint natif (déprécié mais parfois encore
          # servi) des logs de conteneur, avec la clé IAM directement.
          NS_JSON="$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/containers/v1beta1/regions/fr-par/namespaces?name=nodaq-staging")"
          NS_ID="$(echo "$NS_JSON" | jq -r '.namespaces[0].id // empty')"
          if [ -n "$NS_ID" ]; then
            CONT_JSON="$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers?namespace_id=$NS_ID&page_size=50")"
            for NAME in ${{ inputs.containers || 'api litellm' }}; do
              CID="$(echo "$CONT_JSON" | jq -r ".containers[] | select(.name==\"$NAME\") | .id")"
              [ -n "$CID" ] || continue
              echo "── Endpoint natif logs « $NAME » ──"
              NCODE="$(curl -s -o /tmp/native.json -w '%{http_code}' -H "X-Auth-Token: $SCW_SECRET_KEY" \
                "https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/$CID/logs?page_size=50&order_by=timestamp_desc" || echo 000)"
              echo "(HTTP $NCODE)"
              if [ "$NCODE" = "200" ]; then
                jq -r '.logs[]? | "\(.timestamp) \(.message)"' /tmp/native.json | tac || head -c 1500 /tmp/native.json
              else
                head -c 400 /tmp/native.json; echo
              fi
            done
          fi
          # Laisse au token Cockpit le temps de se propager avant Loki.
          sleep 10
          END="$(date +%s)000000000"
          START="$(( $(date +%s) - 7200 ))000000000"
          BODY="$(mktemp)"
          for NAME in ${{ inputs.containers || 'api litellm' }}; do
            echo "═══ Derniers logs « $NAME » (2 h) ═══"
            for AUTH in "X-Token: $TOKEN_SECRET" "Authorization: Bearer $TOKEN_SECRET"; do
              CODE="$(curl -sG -o "$BODY" -w '%{http_code}' "$DS_URL/loki/api/v1/query_range" \
                -H "$AUTH" \
                --data-urlencode "query={resource_type=\"serverless_container\", resource_name=\"$NAME\"}" \
                --data-urlencode "limit=60" \
                --data-urlencode "start=$START" --data-urlencode "end=$END" \
                --data-urlencode "direction=backward" || echo 000)"
              echo "(auth ${AUTH%%:*} -> HTTP $CODE)"
              [ "$CODE" = "401" ] || [ "$CODE" = "403" ] || break
            done
            if ! jq -e '.data.result' "$BODY" >/dev/null 2>&1; then
              echo "(réponse Loki inattendue, HTTP $CODE)"; head -c 800 "$BODY"; echo
              continue
            fi
            COUNT="$(jq '[.data.result[].values[]] | length' "$BODY")"
            if [ "$COUNT" = "0" ]; then
              echo "(AUCUN log applicatif — le process ne démarre probablement même pas :"
              echo " échec avant exec — image/plateforme/stockage.)"
            else
              jq -r '[.data.result[].values[]] | sort_by(.[0]) | .[][1]' "$BODY"
            fi
            echo
          done
          # Nettoyage du token éphémère.
          [ -n "$TOKEN_ID" ] && curl -s -X DELETE -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "$API/tokens/$TOKEN_ID" >/dev/null || true
