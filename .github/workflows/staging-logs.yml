# Diagnostic : reproduit le BOOT des images staging (api, litellm) directement
# sur le runner GitHub avec docker — mêmes variables d'env que les conteneurs
# Scaleway (cf. infra/main.tf). Le runner a l'accès réseau (Secret Manager,
# RDB en ACL ouverte), donc un crash au boot se reproduit ici avec sa stack
# trace complète dans le log. Si l'image boote ICI mais crashe chez Scaleway,
# le problème est côté plateforme (sandbox/ressources), pas côté code.
# Aucun secret affiché : l'app ne logge jamais de valeur de secret (règle 5).

name: Staging container logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID || '955f9c20-9d60-4943-a810-71c737a42a45' }}
    steps:
      - name: Garde-fou secrets
        run: |
          [ -n "$SCW_SECRET_KEY" ] || { echo "::error::SCW_SECRET_KEY manquant"; exit 1; }

      - name: Modèles disponibles sur Generative APIs
        # Le chat échoue si un model de ops/litellm/config.yaml n'existe pas :
        # liste OFFICIELLE côté compte (aucune donnée sensible, ids publics).
        run: |
          curl -s https://api.scaleway.ai/v1/models \
            -H "Authorization: Bearer $SCW_SECRET_KEY" \
            | jq -r '.data[]?.id // empty' | sort || true

      - name: Images déployées (API Scaleway)
        id: images
        run: |
          set -euo pipefail
          NS_ID="$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/containers/v1beta1/regions/fr-par/namespaces?name=nodaq-staging" \
            | jq -r '.namespaces[0].id // empty')"
          [ -n "$NS_ID" ] || { echo "::error::namespace nodaq-staging introuvable"; exit 1; }
          CONT_JSON="$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \
            "https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers?namespace_id=$NS_ID&page_size=50")"
          echo "$CONT_JSON" | jq -r '.containers[] | "\(.name): \(.status) — \(.error_message // "ok") — \(.registry_image // .image)"'
          {
            echo "api_image=$(echo "$CONT_JSON" | jq -r '.containers[] | select(.name=="api") | .registry_image // .image')"
            echo "litellm_image=$(echo "$CONT_JSON" | jq -r '.containers[] | select(.name=="litellm") | .registry_image // .image')"
            echo "api_url=https://$(echo "$CONT_JSON" | jq -r '.containers[] | select(.name=="api") | .domain_name')"
            echo "web_url=https://$(echo "$CONT_JSON" | jq -r '.containers[] | select(.name=="web") | .domain_name')"
            echo "litellm_url=https://$(echo "$CONT_JSON" | jq -r '.containers[] | select(.name=="litellm") | .domain_name')"
          } >> "$GITHUB_OUTPUT"

      - name: Login registre Scaleway
        run: echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

      - name: Boot api sur le runner (mêmes env que Scaleway)
        run: |
          set -uo pipefail
          IMG="${{ steps.images.outputs.api_image }}"
          echo "Image : $IMG"
          docker pull -q "$IMG"
          # LITELLM_MASTER_KEY factice : lu seulement lors d'un appel LLM,
          # jamais au boot. Les autres env répliquent infra/main.tf.
          docker run -d --name api-repro -p 8080:8080 \
            -e NODE_ENV=production -e PORT=8080 \
            -e SCW_DEFAULT_REGION=fr-par \
            -e SCW_DEFAULT_PROJECT_ID="$SCW_DEFAULT_PROJECT_ID" \
            -e SCW_SECRET_PREFIX=nodaq-staging- \
            -e SCW_SECRET_KEY="$SCW_SECRET_KEY" -e SCW_ACCESS_KEY="$SCW_ACCESS_KEY" \
            -e LITELLM_BASE_URL="${{ steps.images.outputs.litellm_url }}" \
            -e LITELLM_MASTER_KEY=dummy-not-used-at-boot \
            -e WEB_ORIGIN="${{ steps.images.outputs.web_url }}" \
            -e AUTH_BASE_URL="${{ steps.images.outputs.api_url }}" \
            "$IMG"
          sleep 20
          # curl AVANT docker logs : l'erreur éventuelle du /health doit être
          # dans les logs capturés. Le corps de réponse est name-only par
          # design (setErrorHandler), affichable sans risque.
          echo "── /health local ──"
          curl -s --max-time 10 http://localhost:8080/health; echo
          echo "── docker logs (60 dernières lignes) ──"
          docker logs api-repro 2>&1 | tail -60
          echo "── état ──"
          docker inspect api-repro --format 'Running={{.State.Running}} ExitCode={{.State.ExitCode}} OOM={{.State.OOMKilled}}'
          docker rm -f api-repro >/dev/null

      - name: Boot litellm sur le runner
        run: |
          set -uo pipefail
          IMG="${{ steps.images.outputs.litellm_image }}"
          echo "Image : $IMG"
          docker pull -q "$IMG"
          # Mémoire contrainte à la valeur Scaleway (1 GiB) : si le conteneur
          # est OOM-killed ici, c'est la cause du « unable to start » en v2.
          docker run -d --name litellm-repro -p 4000:4000 \
            --memory 1073741824 --memory-swap 1073741824 \
            -e MISTRAL_API_KEY= \
            -e LITELLM_MASTER_KEY=dummy-master-key \
            -e SCW_GENERATIVE_API_KEY="$SCW_SECRET_KEY" \
            "$IMG"
          sleep 30
          echo "── docker logs (40 dernières lignes) ──"
          docker logs litellm-repro 2>&1 | tail -40
          echo "── état ──"
          docker inspect litellm-repro --format 'Running={{.State.Running}} ExitCode={{.State.ExitCode}} OOM={{.State.OOMKilled}}'
          curl -s -o /dev/null -w '/health/liveliness local : HTTP %{http_code}\n' --max-time 10 http://localhost:4000/health/liveliness || true
          docker rm -f litellm-repro >/dev/null
