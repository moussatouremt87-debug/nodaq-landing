name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
      APP_DATABASE_URL: postgresql://app_user:app_password@localhost:5432/appdb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations (schéma + RLS + rôle app_user)
        run: pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `pipefail` : sans lui, le `tee` renverrait 0 et un échec de tests
      # passerait pour un succès — le pire des défauts possibles sur cette
      # étape. Rapport JUnit PAR PAQUET (chemin relatif au paquet, donc pas de
      # collision) + journal brut, tous deux versés en artefact ci-dessous.
      - name: Tests (dont isolation multi-tenant — bloquants)
        run: |
          set -o pipefail
          pnpm test -- --reporter=default --reporter=junit --outputFile.junit=./junit.xml 2>&1 \
            | tee vitest-output.log

      # `always()` : l'artefact n'a d'intérêt QUE quand l'étape précédente a
      # échoué. Sans lui, le seul cas où l'on a besoin des logs est justement
      # celui où ils ne sont pas produits.
      #
      # Motif : le tail des logs GitHub est saturé par le dump du conteneur
      # PostgreSQL à l'arrêt, ce qui rend le nom du test en échec
      # irrécupérable par l'API. Un CI dont on ne peut pas lire les échecs
      # coûte une demi-heure à chaque build rouge.
      - name: Rapports de tests (téléchargeables, même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: |
            vitest-output.log
            **/junit.xml
          retention-days: 14
          if-no-files-found: warn

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
      APP_DATABASE_URL: postgresql://app_user:app_password@localhost:5432/appdb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Activer pgvector
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Installer les dépendances Node (migrations Prisma)
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations (schéma + RLS — Prisma est LA source du schéma)
        run: pnpm db:migrate:deploy

      - uses: astral-sh/setup-uv@v5

      - name: Lint Python (ruff) — rag
        working-directory: services/rag
        run: uv run ruff check

      - name: Types Python (mypy strict) — rag
        working-directory: services/rag
        run: uv run mypy

      - name: Tests Python (dont isolation tenant — bloquants) — rag
        working-directory: services/rag
        run: uv run pytest

      - name: Lint Python (ruff) — ocr
        working-directory: services/ocr
        run: uv run ruff check

      - name: Types Python (mypy strict) — ocr
        working-directory: services/ocr
        run: uv run mypy

      - name: Tests Python — ocr
        working-directory: services/ocr
        run: uv run pytest
